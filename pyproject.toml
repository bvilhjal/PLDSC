[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pldsc"
dynamic = ["version"]
description = "Population-aware LD Score regression research tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["pldsc"]

[tool.setuptools.dynamic]
version = { attr = "pldsc.__version__" }
