[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pldsc"
dynamic = ["version"]
description = "Fast univariate and bivariate LD Score regression and population structure research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Bjarni J. Vilhjalmsson" },
]
dependencies = ["numpy>=2.0", "allelign>=0.1.0.dev8"]

[project.scripts]
pldsc = "pldsc.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]
fast = ["numba>=0.62"]
plot = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/bvilhjal/PLDSC"
Issues = "https://github.com/bvilhjal/PLDSC/issues"

[tool.setuptools]
packages = ["pldsc"]

[tool.setuptools.package-data]
pldsc = ["data/*.npz", "data/*.json"]

[tool.setuptools.dynamic]
version = { attr = "pldsc.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Family convention: pyflakes-only, by design. Long lines and multi-statement
# lines are intentional; do not reformat or add style rules.
lint.select = ["F"]
